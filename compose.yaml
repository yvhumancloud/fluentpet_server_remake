services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: fluentpet
      POSTGRES_PASSWORD: fluentpet
      POSTGRES_DB: fluentpet
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentpet"]
      interval: 2s
      retries: 15

  api:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fluentpet:fluentpet@db:5432/fluentpet
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  pgdata:
