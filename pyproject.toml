[project]
name = "fluentpet-api"
version = "0.1.0"
description = "FluentPet backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "firebase-admin==7.5.0",
    "boto3==1.43.95",
    "httpx==0.28.1",
    "typer==0.27.2",
    "python-multipart==0.0.32",
    "sentry-sdk[fastapi]==2.69.2",
    "anthropic==1.7.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
