name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: fluentpet, POSTGRES_PASSWORD: fluentpet, POSTGRES_DB: fluentpet_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.15" }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv export --no-dev -o /tmp/req.txt && uvx pip-audit --disable-pip -r /tmp/req.txt
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.15" }
      - name: migrate (against Neon, before the new image goes live)
        run: uv sync --frozen --no-dev && uv run alembic upgrade head
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: build and push
        env: { REPO: "${{ steps.ecr.outputs.registry }}/fluentpet/api" }
        run: |
          docker build -t "$REPO:${{ github.sha }}" -t "$REPO:latest" .
          docker push --all-tags "$REPO"
      - name: deploy (run deploy/ec2.sh on the box tagged Name=fluentpet-api, via SSM)
        run: |
          CMD=$(aws ssm send-command --document-name AWS-RunShellScript --comment "${{ github.sha }}" \
            --targets Key=tag:Name,Values=fluentpet-api --timeout-seconds 600 \
            --parameters commands="curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/ec2.sh | bash" \
            --query Command.CommandId --output text)
          for _ in $(seq 60); do
            S=$(aws ssm list-command-invocations --command-id "$CMD" --query 'CommandInvocations[0].Status' --output text)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac; sleep 5
          done
          aws ssm list-command-invocations --command-id "$CMD" --details --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
          echo "status: $S"; [ "$S" = Success ]
